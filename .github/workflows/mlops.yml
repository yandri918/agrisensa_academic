name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    
    # Optional: Set default working directory if pipeline is not at root
    defaults:
      run:
        working-directory: mlops_backend/pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install dvc pandas scikit-learn mlflow pyyaml; fi

      # Pull data dari DagsHub menggunakan Token Rahasia
      - name: Configure DVC & Pull Data
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user yandri918
          dvc remote modify origin --local password $DAGSHUB_TOKEN
          dvc pull || true

      - name: Run DVC Pipeline
        # --force ensures all stages run and evaluation JSON files are always created
        run: dvc repro --force

      - name: Upload Evaluation Metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-metrics
          path: |
            mlops_backend/pipeline/evaluation.json
            mlops_backend/pipeline/evaluation_crop.json
            mlops_backend/pipeline/evaluation_price.json
          retention-days: 30

      # CML (Continuous Machine Learning) can be used here to comment metrics on the PR
      # - name: Report metrics with CML
      #   uses: iterative/setup-cml@v1
